version: 2

# Scheduled version updates. Security updates are enabled separately at the
# repo level and do not require this file. Grouped to keep PR noise low.
updates:
  # Python backend (uv / uv.lock at repo root).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend (Next.js app).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      scope: "web"
    groups:
      web-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Production backend (Cloudflare Workers TypeScript port).
  - package-ecosystem: "npm"
    directory: "/deploy/cloudflare-workers"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      scope: "cf-workers"
    groups:
      cf-workers-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by CI/deploy workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
