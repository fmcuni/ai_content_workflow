name: Collab E2E

# Live two-context realtime-collab e2e (tests/e2e/collab-realtime.spec.ts) on an
# ephemeral runner with an ISOLATED local DB. This is the correctness gate for
# flipping NEXT_PUBLIC_COLLAB_ENABLED on in prod — it cannot run on the dev
# machine (the dual-browser + dual-dev-server load OOMs it), so it lives here.
#
# Nothing touches prod: the DB is a throwaway local Supabase, the backend runs
# via `wrangler dev` against it (no Hyperdrive → cold-store path is a local no-op,
# same as the spec header notes), and the web app is built collab-ON pointed at
# the local backend. The spec is SKIP-gated on E2E_COLLAB_BASE_URL, which we set
# only here.

on:
  workflow_dispatch:
  push:
    branches: [feat/realtime-collab-per-author]

concurrency:
  group: collab-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collab-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      BACKEND_PORT: "8799"
      WEB_PORT: "4311"
      E2E_EMAIL: collab-e2e@bowtie.com.hk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Supabase local stack provides an isolated Postgres on :54322 and applies
      # ALL migrations (incl. 20260612000000_run_collab_state) + seed.sql
      # (the bowtie-editor persona the seeded run references). Docker is
      # preinstalled on ubuntu-latest. We exclude the services the e2e never
      # touches (the backend talks to Postgres directly — no PostgREST/GoTrue) to
      # cut image pulls and dodge the edge-runtime TLS bootstrap that fails in
      # sandboxes.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (DB + migrations + seed)
        run: supabase start -x edge-runtime -x studio -x imgproxy -x logflare -x vector

      - name: Install web deps
        working-directory: web
        # npm install (not ci): the lockfile is macOS-generated and omits the
        # linux-only optional native deps; strict `npm ci` fails (mirrors deploy).
        run: npm install --no-audit --no-fund

      - name: Install workers deps
        working-directory: deploy/cloudflare-workers
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # A throwaway password generated per-run; never printed. Stored in the job
      # env via $GITHUB_ENV (masked) so later steps can sign up + log in with it.
      - name: Generate test credentials
        run: |
          PW="Collab-$(openssl rand -hex 8)!"
          echo "::add-mask::$PW"
          echo "E2E_PASSWORD=$PW" >> "$GITHUB_ENV"

      # Backend env. POSTGRES_URL is required by /setup/status presence-check
      # (else the web SetupGate blocks the board); the actual DB connection goes
      # through HYPERDRIVE, wired below. EMAIL_VERIFICATION=off so sign-up + login
      # work without email. AUTH_SECRET is a throwaway local secret.
      - name: Write backend .dev.vars
        working-directory: deploy/cloudflare-workers
        run: |
          cat > .dev.vars <<EOF
          AUTH_SECRET="$(openssl rand -hex 32)"
          FRONTEND_ORIGIN="http://localhost:${WEB_PORT}"
          EMAIL_VERIFICATION="off"
          BOOTSTRAP_ADMIN_EMAILS="${E2E_EMAIL}"
          GEMINI_API_KEY="ci-noop-not-used-by-e2e"
          POSTGRES_URL="${DB_URL}"
          EOF

      # Seed one run → draft → render so /api/runs returns a run and /edit hydrates
      # an editable body. No pipeline/Gemini call needed.
      - name: Seed a run with editable content
        run: |
          psql "${DB_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO content_tool.runs
            (run_id, created_by, status, topic, keywords, mode, acf_adv_id, acf_widget_id, persona, today_date)
          VALUES
            ('11111111-1111-1111-1111-111111111111', 'collab-e2e@bowtie.com.hk', 'completed',
             'Collab E2E Test Article', '["collaboration","e2e"]'::jsonb, 'create', 0, 0, 'bowtie-editor', CURRENT_DATE)
          ON CONFLICT (run_id) DO NOTHING;
          INSERT INTO content_tool.drafts
            (draft_id, run_id, iteration, diagnose, markup_raw, citation_intents)
          VALUES
            ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111', 1,
             'seed draft for collab e2e', '<h2>Collab E2E Seed</h2><p>Original body paragraph for collaborative editing.</p>', '[]'::jsonb)
          ON CONFLICT (draft_id) DO NOTHING;
          INSERT INTO content_tool.renders
            (render_id, draft_id, seo_title, meta_description, html_body, version)
          VALUES
            ('33333333-3333-3333-3333-333333333333', '22222222-2222-2222-2222-222222222222',
             'Collab E2E Test Article', 'Seed render for the realtime-collab two-context e2e.',
             '<h2>Collab E2E Seed</h2><p>Original body paragraph for collaborative editing.</p>', 1)
          ON CONFLICT (render_id) DO NOTHING;
          SQL

      # Production build (NOT `next dev`): dev compiles routes on first hit, and
      # the heavy /edit route's cold compile exceeds Playwright's nav timeout —
      # a real source of flake. A built server serves routes instantly. The
      # NEXT_PUBLIC_* flags are inlined into the client bundle at build time.
      - name: Build web (collab ON, pointed at local backend)
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8799
          NEXT_PUBLIC_COLLAB_ENABLED: "true"
        run: npm run build

      # Orchestrate everything in ONE step so the backgrounded servers stay alive
      # for the test run; a trap tears them down on exit.
      - name: Run collab e2e
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8799
          NEXT_PUBLIC_COLLAB_ENABLED: "true"
          E2E_COLLAB_BASE_URL: http://localhost:4311
        run: |
          set -euo pipefail
          BACK_DIR="../deploy/cloudflare-workers"

          # --- backend: wrangler dev bound to the local DB via Hyperdrive shim ---
          ( cd "$BACK_DIR" && \
            WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="${DB_URL}" \
            npx wrangler dev --port "${BACKEND_PORT}" --ip 127.0.0.1 ) > /tmp/backend.log 2>&1 &
          BACK_PID=$!
          # --- web: production server, collab ON, proxying /api to the backend ---
          ( npm run start -- --port "${WEB_PORT}" ) > /tmp/web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $BACK_PID $WEB_PID 2>/dev/null || true' EXIT

          echo "Waiting for backend /health..."
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${BACKEND_PORT}/health" >/dev/null 2>&1; then echo "backend up ($i)"; break; fi
            sleep 2
            if [ "$i" = 60 ]; then echo "backend never came up"; tail -40 /tmp/backend.log; exit 1; fi
          done

          echo "Signing up the staff test user..."
          curl -sS -X POST "http://localhost:${BACKEND_PORT}/api/auth/sign-up/email" \
            -H 'content-type: application/json' -H "origin: http://localhost:${WEB_PORT}" \
            -d "$(node -e 'console.log(JSON.stringify({name:"Collab E2E",email:process.env.E2E_EMAIL,password:process.env.E2E_PASSWORD}))')" \
            -o /dev/null -w 'signup HTTP %{http_code}\n'

          echo "Waiting for web server..."
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${WEB_PORT}/login" >/dev/null 2>&1; then echo "web up ($i)"; break; fi
            sleep 2
            if [ "$i" = 60 ]; then echo "web never came up"; tail -40 /tmp/web.log; exit 1; fi
          done

          echo "Running the collab e2e..."
          npx playwright test --config=playwright.collab.config.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collab-e2e-results
          path: |
            web/test-results/
            web/playwright-report/
            /tmp/backend.log
            /tmp/web.log
          retention-days: 7
          if-no-files-found: ignore
