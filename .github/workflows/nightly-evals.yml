name: Nightly Evals

on:
  schedule:
    - cron: "0 18 * * *"   # 02:00 HKT
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv venv && uv pip install -e ".[dev]"
      # Evals read the last 30 *published* runs and write results to
      # content_tool.evals — so they must run against the production Supabase DB
      # (the only place real runs exist). Schema is owned by Supabase migrations,
      # not Alembic (retired), so there is no migration step here. Requires the
      # POSTGRES_URL repo secret = the prod Supabase connection string.
      - env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          source .venv/bin/activate
          python -m evals.runner
