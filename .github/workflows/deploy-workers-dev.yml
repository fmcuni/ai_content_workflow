name: Deploy Workers (dev)

# Deploys the isolated DEV stack (bowtie-content-tool-poc-dev +
# bowtie-content-tool-web-dev) to the SAME Cloudflare account as prod (Franco's
# "Bowtie Content SEO" account, franco-ma.workers.dev), via wrangler named
# environments (`--env dev`). This is the CI counterpart to the manual
# `npm run deploy:dev` / `npm run cf:deploy:dev` — it makes dev deploys
# reproducible so dev stops drifting from main / from the operator's shell.
#
# TRIGGER: push to a dev branch (`dev` or `dev/**`), plus manual dispatch. Dev is
# the pre-prod verification stack; deploying it off dev branches keeps prod
# deploys (now Cloudflare Workers Builds on the Bowtie Enterprise account, on push
# to `main`) cleanly separate from day-to-day dev iteration. Work on a
# `dev/<feature>` branch to auto-refresh the dev Workers; promote to `main` only
# when ready for prod.
#
# This dev stack stays on Franco's personal franco-ma.workers.dev account (via the
# CF_ALT_* secrets) for now — only PROD is moving to the Enterprise account.
#
# Build-time NEXT_PUBLIC_* values come from the committed SSOT web/env.dev.public
# (parsed by scripts/deploy-web.mjs) — never hand-typed. The one secret (the dev
# Supabase anon key) is injected from the NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV repo
# secret.
#
# NOTE: dev runtime secrets on the -dev Worker (POSTGRES_URL, GEMINI_API_KEY,
# SUPABASE_SERVICE_ROLE_KEY, WP_*) are set ONCE via `wrangler secret put --env
# dev` and preserved across deploys — they are NOT synced here.

on:
  push:
    branches:
      - dev
      - "dev/**"
  workflow_dispatch:

concurrency:
  group: deploy-workers-dev
  cancel-in-progress: false

jobs:
  deploy-backend-dev:
    name: Deploy backend Worker (dev)
    runs-on: ubuntu-latest
    # Only the canonical fmcuni fork holds the CLOUDFLARE_* secrets.
    if: ${{ github.repository_owner == 'fmcuni' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: deploy/cloudflare-workers
        # npm install (not ci): the lockfile is macOS-generated and omits the
        # linux-only optional native deps, so strict `npm ci` fails on ubuntu.
        run: npm install --no-audit --no-fund

      - name: Check secret drift (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ALT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ALT_ACCOUNT_ID }}
        run: node scripts/check-secrets.mjs --env dev

      - name: Deploy backend Worker (bowtie-content-tool-poc-dev)
        working-directory: deploy/cloudflare-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ALT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ALT_ACCOUNT_ID }}
        run: npm run deploy:dev

  deploy-frontend-dev:
    name: Deploy frontend Worker (dev)
    runs-on: ubuntu-latest
    needs: deploy-backend-dev
    if: ${{ github.repository_owner == 'fmcuni' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Deploy frontend Worker (bowtie-content-tool-web-dev)
        working-directory: web
        # NEXT_PUBLIC_* (API base, Supabase URL, collab flag) come from the SSOT
        # web/env.dev.public via scripts/deploy-web.mjs. Only the anon key secret
        # + Cloudflare creds are injected here.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ALT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ALT_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV }}
        run: npm run cf:deploy:dev
