name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      # Lint/typecheck the touched files only. The repo carries a large
      # pre-existing ruff + pyright baseline; the policy (CLAUDE.md) is "don't
      # add new errors in touched files", so we gate on changed Python files
      # rather than the whole tree.
      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py' > .changed_py.txt
          echo "Changed Python files:"; cat .changed_py.txt
      - name: Ruff (changed files)
        run: |
          source .venv/bin/activate
          if [ -s .changed_py.txt ]; then
            xargs -r ruff check < .changed_py.txt
          else
            echo "No changed Python files; skipping ruff."
          fi
      # Pyright is advisory: strict mode reports a ~547-error baseline that
      # cannot block. Run it for visibility but don't fail the job.
      - name: Pyright (advisory)
        continue-on-error: true
        run: source .venv/bin/activate && pyright
      - run: source .venv/bin/activate && pytest -v

  judge-evals:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'prompt-change')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: content_tool
          POSTGRES_PASSWORD: content_tool
          POSTGRES_DB: content_tool
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[dev]"
      - env:
          POSTGRES_URL: postgresql+asyncpg://content_tool:content_tool@localhost:5432/content_tool
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          source .venv/bin/activate
          alembic upgrade head
          # Engineer extends evals/runner.py to support a "sample 5 fixtures with judge" mode.
          # MVP: just exercise judge_runner against canned fixtures to prove wiring.
          pytest tests/unit/test_judge_runner.py -v
