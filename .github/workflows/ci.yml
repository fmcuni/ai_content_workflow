name: CI

# Python-only suite (ruff + pyright + pytest): run only when Python-relevant
# files change. Web/Workers pushes are covered by their own workflows.
on:
  pull_request:
    paths:
      - '**/*.py'
      - 'prompts/**'
      - 'config/**'
      - 'supabase/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'prompts/**'
      - 'config/**'
      - 'supabase/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      # Lint/typecheck the touched files only. The repo carries a large
      # pre-existing ruff + pyright baseline; the policy (CLAUDE.md) is "don't
      # add new errors in touched files", so we gate on changed Python files
      # rather than the whole tree.
      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py' > .changed_py.txt
          echo "Changed Python files:"; cat .changed_py.txt
      - name: Ruff (changed files)
        run: |
          source .venv/bin/activate
          if [ -s .changed_py.txt ]; then
            xargs -r ruff check < .changed_py.txt
          else
            echo "No changed Python files; skipping ruff."
          fi
      # Pyright is advisory: strict mode reports a ~547-error baseline that
      # cannot block. Run it for visibility but don't fail the job.
      - name: Pyright (advisory)
        continue-on-error: true
        run: source .venv/bin/activate && pyright
      - run: source .venv/bin/activate && pytest -v

  judge-evals:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'prompt-change')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[dev]"
      # Exercises judge_runner against canned fixtures (FakeGeminiClient) to prove
      # wiring — no DB and no real Gemini key needed. When evals/runner.py grows a
      # "sample N fixtures with judge" mode that hits a real DB, add schema setup via
      # the supabase migrations (see tests/conftest.py apply_migrations / the
      # nightly-evals workflow) and the GEMINI_API_KEY secret — NOT alembic (retired;
      # schema is Supabase-owned).
      - run: |
          source .venv/bin/activate
          pytest tests/unit/test_judge_runner.py -v
