name: Deploy Workers

# Deploys the Workers-native stack to Cloudflare on push to main.
#
# This replaces the retired "Worker + 2 Containers" stack (the old
# deploy-cloudflare.yml + Dockerfile.cf-backend/.cf-frontend). The Python
# backend in content_tool/ is NOT deployed here — it remains for the evals and
# local dev. The production backend is now the TypeScript Worker in
# deploy/cloudflare-workers/.
#
# Two Workers are deployed, both on Franco's "Bowtie Content SEO" Cloudflare
# account (franco-ma.workers.dev):
#   - Backend  : bowtie-content-tool-poc  (deploy/cloudflare-workers/)
#   - Frontend : bowtie-content-tool-web  (web/, OpenNext)
#
# INTERIM STATE (2026-07-07): this account was previously called "alt" in this
# repo's history — it hosted a compute-only duplicate of prod while the real
# prod lived on a separate personal account (fmc.workers.dev, CLOUDFLARE_*
# secrets). Franco has confirmed franco-ma.workers.dev is the real production
# the marketing team uses, and is deprecating the fmc account. This workflow
# has been repointed to use the CF_ALT_* secrets (already provisioned — no new
# secret needed) as the SOLE deploy target; the old fmc-targeting steps and the
# separate "alt account" duplicate-deploy steps have been removed.
#
# This workflow (and deploy-workers-dev.yml) is a stop-gap. The end goal
# (tracked in docs/secrets-and-ci.md) is to move deploys to Cloudflare Workers
# Builds (native git integration), so no Cloudflare credential needs to live in
# GitHub Actions at all — delete both workflow files once that is set up and
# verified for all four Workers.
#
# Required repo secrets:
#   CF_ALT_API_TOKEN       — token with Workers Scripts edit, on the
#                            franco-ma.workers.dev account
#   CF_ALT_ACCOUNT_ID      — that account's id
#   NEXT_PUBLIC_SUPABASE_ANON_KEY — public client key, routed through a secret
#                            for hygiene (frontend build-time var)
# wrangler reads the CF_ALT_* pair via CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID
# env vars set per-step below.
#
# Runtime secrets (POSTGRES_URL / GEMINI_API_KEY / WP_*) are NOT synced here.
# They are set once per Worker via `wrangler secret put` and are preserved
# across `wrangler deploy` runs.

on:
  push:
    branches: [main]
    paths:
      - "deploy/cloudflare-workers/**"
      - "web/**"
      - "config/**"
      - "prompts/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend Worker
    runs-on: ubuntu-latest
    # Deploys run only from the canonical fmcuni fork — the bowtie-ins mirror
    # has no CLOUDFLARE_* secrets, so its deploy runs would always fail red.
    if: ${{ github.repository_owner == 'fmcuni' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: deploy/cloudflare-workers
        # npm install (not ci): the lockfile is generated on macOS and omits the
        # linux-only optional native deps (@emnapi/*), so strict `npm ci` fails on
        # the ubuntu runner. install resolves the platform deps at deploy time.
        run: npm install --no-audit --no-fund

      # Names-only drift guard: fails if a required secret is missing on the
      # live Worker (catches a broken/half-provisioned env before we deploy).
      - name: Check secret drift (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ALT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ALT_ACCOUNT_ID }}
        run: node scripts/check-secrets.mjs

      - name: Deploy backend Worker (bowtie-content-tool-poc)
        working-directory: deploy/cloudflare-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ALT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ALT_ACCOUNT_ID }}
        run: npx wrangler deploy

  deploy-frontend:
    name: Deploy frontend Worker
    runs-on: ubuntu-latest
    # Deploy the frontend after the backend so the API it points at is live.
    needs: deploy-backend
    if: ${{ github.repository_owner == 'fmcuni' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: web
        # npm install (not ci): the lockfile is generated on macOS and omits the
        # linux-only optional native deps (@emnapi/*), so strict `npm ci` fails on
        # the ubuntu runner. install resolves the platform deps at deploy time.
        run: npm install --no-audit --no-fund

      - name: Deploy frontend Worker (bowtie-content-tool-web)
        working-directory: web
        # All build-time NEXT_PUBLIC_* values come from the committed SSOT
        # web/env.prod.public (parsed by scripts/deploy-web.mjs), so they are no
        # longer hand-maintained here. Only the secret (anon key) + Cloudflare
        # creds are injected. To roll collab back: edit NEXT_PUBLIC_COLLAB_ENABLED
        # in web/env.prod.public and redeploy (or `wrangler rollback`).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ALT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ALT_ACCOUNT_ID }}
          # Public client key, routed through an Actions secret for hygiene.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run cf:deploy

      # 2026-07-06: a CI-built frontend artifact deployed "green" while every
      # server-rendered route hung until the CPU limit (login was down for all
      # logged-out users). Fail the job loudly if the just-deployed Worker
      # can't serve /login quickly.
      - name: Smoke-check prod frontend (/login must 200)
        run: node scripts/smoke-check.mjs "https://bowtie-content-tool-web.franco-ma.workers.dev/login"
