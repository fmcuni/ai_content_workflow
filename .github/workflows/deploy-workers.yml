name: Deploy Workers

# Deploys the Workers-native stack to Cloudflare on push to main.
#
# This replaces the retired "Worker + 2 Containers" stack (the old
# deploy-cloudflare.yml + Dockerfile.cf-backend/.cf-frontend). The Python
# backend in content_tool/ is NOT deployed here — it remains for the evals and
# local dev. The production backend is now the TypeScript Worker in
# deploy/cloudflare-workers/.
#
# Two Workers are deployed on the personal Cloudflare account (fmc.workers.dev):
#   - Backend  : bowtie-content-tool-poc  (deploy/cloudflare-workers/)
#   - Frontend : bowtie-content-tool-web  (web/, OpenNext)
#
# Required repo secrets (same names the retired workflow used; they already
# target the fmc account):
#   CLOUDFLARE_API_TOKEN   — token with Workers Scripts edit
#   CLOUDFLARE_ACCOUNT_ID  — target Cloudflare account id
# wrangler reads both from the environment automatically.
#
# Runtime secrets (POSTGRES_URL / GEMINI_API_KEY / WP_*) are NOT synced here.
# They are set once per Worker via `wrangler secret put` and are preserved
# across `wrangler deploy` runs.

on:
  push:
    branches: [main]
    paths:
      - "deploy/cloudflare-workers/**"
      - "web/**"
      - "config/**"
      - "prompts/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend Worker
    runs-on: ubuntu-latest
    # Deploys run only from the canonical fmcuni fork — the bowtie-ins mirror
    # has no CLOUDFLARE_* secrets, so its deploy runs would always fail red.
    if: ${{ github.repository_owner == 'fmcuni' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: deploy/cloudflare-workers
# npm install (not ci): the lockfile is generated on macOS and omits the
        # linux-only optional native deps (@emnapi/*), so strict `npm ci` fails on
        # the ubuntu runner. install resolves the platform deps at deploy time.
        run: npm install --no-audit --no-fund

      # Names-only drift guard: fails if a required secret is missing on the
      # live Worker (catches a broken/half-provisioned env before we deploy).
      - name: Check secret drift (prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-secrets.mjs

      - name: Deploy backend Worker (bowtie-content-tool-poc)
        working-directory: deploy/cloudflare-workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  deploy-frontend:
    name: Deploy frontend Worker
    runs-on: ubuntu-latest
    # Deploy the frontend after the backend so the API it points at is live.
    needs: deploy-backend
    if: ${{ github.repository_owner == 'fmcuni' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: web
# npm install (not ci): the lockfile is generated on macOS and omits the
        # linux-only optional native deps (@emnapi/*), so strict `npm ci` fails on
        # the ubuntu runner. install resolves the platform deps at deploy time.
        run: npm install --no-audit --no-fund

      - name: Deploy frontend Worker (bowtie-content-tool-web)
        working-directory: web
        # All build-time NEXT_PUBLIC_* values come from the committed SSOT
        # web/env.prod.public (parsed by scripts/deploy-web.mjs), so they are no
        # longer hand-maintained here. Only the secret (anon key) + Cloudflare
        # creds are injected. To roll collab back: edit NEXT_PUBLIC_COLLAB_ENABLED
        # in web/env.prod.public and redeploy (or `wrangler rollback`).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Public client key, routed through an Actions secret for hygiene.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run cf:deploy
