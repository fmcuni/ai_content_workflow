[package]
name = "bowtie-content-tool"
version = "0.6.0"
description = "Bowtie AI Content Tool — desktop shell"
authors = ["Bowtie"]
edition = "2021"
rust-version = "1.77"

# The binary that Tauri launches. `_lib` suffix avoids a name clash with the
# library target on some platforms (Tauri 2 convention).
[[bin]]
name = "bowtie-content-tool"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Opens external URLs in the system browser. The webview loads the frontend
# from http://127.0.0.1:3000 and swallows target="_blank"/external navigations,
# so links are routed through this plugin instead.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by Tauri's CLI for production builds.
custom-protocol = ["tauri/custom-protocol"]
