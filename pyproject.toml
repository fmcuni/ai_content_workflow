[project]
name = "content_tool"
version = "0.1.0"
description = "Bowtie AI Content Tool — Update Article Route (MVP)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "google-genai>=1.0",
  "httpx>=0.28",
  "structlog>=24.4",
  "pyyaml>=6.0",
  "tldextract>=5.1",
  "click>=8.1",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-postgres>=2.0",
  "markdownify>=0.13",
  "beautifulsoup4>=4.12",
  "sse-starlette>=2.1",
  "markdown-it-py>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "testcontainers[postgres]>=4.8",
  "respx>=0.21",
  "ruff>=0.7",
  "pyright>=1.1.388",
]

[project.scripts]
content-tool = "content_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
