# Gemini pricing — USD per 1M tokens. Update when Google changes pricing.
# Source: https://ai.google.dev/gemini-api/docs/pricing
#
# Rates are the Standard (paid) tier for prompts <= 200k tokens. This tool's
# prompts/outputs sit well under that threshold, so the long-context (>200k)
# rates are intentionally not modelled here.
gemini-3.1-pro-preview:
  input_per_million_usd: 2.00
  output_per_million_usd: 12.00
  thinking_per_million_usd: 12.00     # thinking tokens billed at output rate
gemini-3.5-flash:
  input_per_million_usd: 0.30
  output_per_million_usd: 2.50
  thinking_per_million_usd: 2.50      # thinking tokens billed at output rate
