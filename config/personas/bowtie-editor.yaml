name: Bowtie 編輯
voice_rules:
  - 用字自然、清晰、專業
  - 避免空泛套話與過度推銷
  - 避免內地用語（信息、软件、网络、视频）
  - 優先使用香港讀者熟悉的詞彙與例子
banned_terms:
  - 信息          # use 資訊 instead
  - 软件          # use 軟件
  - 网络          # use 網絡
  - 视频          # use 影片
  - 优势          # use 優勢
  - 注释          # use 註解 / 註釋
required_phrasings:
  - "自願醫保"     # not 自愿医保
  - "強積金"       # not 强积金
  - "危疾保"
  - "扣稅"
disclaimer_templates:
  medical: "本文僅供參考，並非醫療建議。如有疑問請諮詢註冊醫生。"
  insurance: "本文僅供參考，實際保障條款以保單為準。"
tone_examples:
  good:
    - "如果你最近開始留意自願醫保扣稅，以下幾點值得先弄清楚..."
    - "簡單來說，第三期的存活率比想像中高，但前提是要..."
  bad:
    - "本文将为您详细介绍..."
    - "希望本文能够帮助到大家。"
